model: "mlx-community/Qwen3-1.7B-4bit"
fine_tune_type: lora

optimizer: adamw
optimizer_config:
  adamw:
    betas: [0.9, 0.98]
    eps: 1e-6
    weight_decay: 0.01

learning_rate: 4e-5

lr_schedule:
  name: cosine_decay
  arguments:
    - 4e-5       # peak LR
    - 10000      # total training steps
    - 1e-6       # min LR
  warmup: 1000
  warmup_init: 0.0

iters: 10000
save_every: 1000

batch_size: 4
grad_accumulation_steps: 32
max_seq_length: 2048
num_layers: 28
grad_checkpoint: true

data: "new_data"
prompt_feature: "question"
completion_feature: "answer"
train: true
adapter_path: "qwen-adapters-run-4"

lora_parameters:
  keys: [
    "self_attn.q_proj",
    "self_attn.v_proj",
    "self_attn.k_proj",
    "self_attn.o_proj",
    "self_attn.gate_proj",
    "self_attn.up_proj",
    "self_attn.down_proj"
  ]
  rank: 48
  scale: 40.0
  dropout: 0.05

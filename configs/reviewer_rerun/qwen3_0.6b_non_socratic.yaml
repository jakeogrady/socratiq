model: "mlx-community/Qwen3-0.6B-bf16"
model_revision: "42096995f6402fde107068cf530136fe64b604f8"
model_precision: "bfloat16"
train: true
fine_tune_type: lora
optimizer: adamw
optimizer_config:
  adamw:
    betas: [0.9, 0.98]
    eps: 1.0e-6
    weight_decay: 0.01
learning_rate: 8.0e-5
lr_schedule:
  name: cosine_decay
  arguments: [8.0e-5, 6000, 1.0e-6]
  warmup: 500
  warmup_init: 0.0
iters: 6000
seed: 42
save_every: 200
steps_per_report: 10
steps_per_eval: 200
val_batches: 25
batch_size: 4
grad_accumulation_steps: 32
max_seq_length: 2048
num_layers: 28
grad_checkpoint: true
mask_prompt: false
data: "data/reviewer_rerun/non_socratic"
prompt_feature: "question"
completion_feature: "answer"
test: false
adapter_path: "runs/reviewer_rerun/training/qwen3_0.6b_non_socratic/adapter"
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 16
  scale: 24.0
  dropout: 0.05

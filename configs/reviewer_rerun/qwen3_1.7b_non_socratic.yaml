model: "mlx-community/Qwen3-1.7B-4bit"
model_revision: "3b1b1768f8f8cf8351c712464f906e86c2b8269e"
model_precision: "4-bit"
train: true
fine_tune_type: lora
optimizer: adamw
optimizer_config:
  adamw:
    betas: [0.9, 0.98]
    eps: 1.0e-6
    weight_decay: 0.01
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  arguments: [1.0e-4, 6000, 1.0e-6]
iters: 6000
seed: 42
save_every: 200
steps_per_report: 10
steps_per_eval: 200
val_batches: 25
batch_size: 4
grad_accumulation_steps: 32
max_seq_length: 2048
num_layers: 28
grad_checkpoint: true
mask_prompt: false
data: "data/reviewer_rerun/non_socratic"
prompt_feature: "question"
completion_feature: "answer"
test: false
adapter_path: "runs/reviewer_rerun/training/qwen3_1.7b_non_socratic/adapter"
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 16
  scale: 8.0
  dropout: 0.05

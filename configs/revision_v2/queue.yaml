# Machine assignment for the revision-v2 runs (Phase 2b).
# Expanded into ordered items by src.revision_v2.queue. Order on each machine:
# core training, determinism check, core greedy evaluation, SC@5, second tier.
# "{peak}" is the accepted Qwen3-0.6B / Llama peak label (8e-5 or 4e-5).
#
# Split: the PI default (chee: Qwen3-1.7B pair and base, then the second tier;
# isik: pilot, Qwen3-0.6B pair, Llama pair and their bases), rebalanced from the
# v1 timings by moving only the Llama BASE-model evaluations to chee. Each
# matched pair is still trained and evaluated on one machine.

machines:
  isik:
    train: ["qwen3_0.6b_socratic_lr{peak}", "qwen3_0.6b_non_socratic_lr{peak}", "llama3.2_1b_socratic_lr{peak}", "llama3.2_1b_non_socratic_lr{peak}"]
    core_conditions: ["qwen3_0.6b_socratic_lr{peak}", "qwen3_0.6b_non_socratic_lr{peak}", "llama3.2_1b_socratic_lr{peak}", "llama3.2_1b_non_socratic_lr{peak}", "qwen3_0.6b_base"]
    second_tier: []
    needs_llama_checkpoint: true
  chee:
    train: ["qwen3_1.7b_socratic_lr1e-4", "qwen3_1.7b_non_socratic_lr1e-4"]
    core_conditions: ["qwen3_1.7b_socratic_lr1e-4", "qwen3_1.7b_non_socratic_lr1e-4", "qwen3_1.7b_base", "llama3.2_1b_base"]
    second_tier: ["qwen3_0.6b_socratic_5k_lr{peak}", "qwen3_0.6b_non_socratic_5k_lr{peak}", "qwen3_0.6b_socratic_10k_lr{peak}", "qwen3_0.6b_non_socratic_10k_lr{peak}"]
    needs_llama_checkpoint: true

pilot:
  machine: "isik"
  run: "qwen3_0.6b_socratic_lr{peak}"

base_conditions:
  qwen3_0.6b_base: "qwen3_0.6b"
  qwen3_1.7b_base: "qwen3_1.7b"
  llama3.2_1b_base: "llama3.2_1b"

# Expected minutes, from the v1 manifests (clean-v1 and GSM-Hard packets).
# Training: chee v1 elapsed; isik is about 15% slower for training (v1 isik
# manifests). Evaluation: v1 timings were similar on both machines. P0 GSM8K and
# GSM-Hard use the v1 four-shot timings as an upper estimate. Items marked
# "estimate" had no v1 counterpart and are scaled from the closest v1 run.

[project]
name = "socratiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "notebook>=7.5.1",
]

[dependency-groups]
dev = [
    "accelerate>=1.12.0",
    "datasets>=4.4.2",
    "dotenv>=0.9.9",
    "gradio>=6.2.0",
    "huggingface-hub>=0.36.0",
    "matplotlib>=3.10.8",
    "mlx-lm[train]>=0.29.1",
    "mlx-lm-lora>=1.0.0",
    "openai>=2.21.0",
    "peft>=0.18.0",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "transformers>=4.57.3",
    "trl>=0.26.2",
    "wandb>=0.23.1",
    "sentence-transformers>=5.2.3",
    "sympy>=1.14.0",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "tqdm>=4.67.1",
    "datasketch>=1.9.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

target-version = "py313"

[tool.ruff.lint]

select = ["ALL"]
ignore = ["D203", "D213", "COM812", "D107", "D100", "D104", "BLE001", "RUF001", "E501", "PLR0913"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false

docstring-code-line-length = "dynamic"

[project]
name = "socratiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "notebook>=7.5.1",
]

[dependency-groups]
rerun = [
    "datasets==4.4.2",
    "mlx==0.30.3",
    "mlx-lm[train]==0.29.1",
    "openai==2.21.0",
    "pyyaml==6.0.3",
    "ruff==0.14.10",
    "transformers==4.57.3",
]
dev = [
    "accelerate>=1.12.0",
    "datasets>=4.4.2",
    "dotenv>=0.9.9",
    "gradio>=6.2.0",
    "huggingface-hub>=0.36.0",
    "matplotlib>=3.10.8",
    "mlx-lm[train]>=0.29.1",
    "mlx-lm-lora>=1.0.0",
    "openai>=2.21.0",
    "peft>=0.18.0",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "transformers>=4.57.3",
    "trl>=0.26.2",
    "wandb>=0.23.1",
    "sentence-transformers>=5.2.3",
    "sympy>=1.14.0",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "tqdm>=4.67.1",
    "datasketch>=1.9.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

target-version = "py313"

[tool.ruff.lint]

select = ["ALL"]
ignore = ["D203", "D213", "COM812", "D107", "D100", "D104", "BLE001", "RUF001", "E501", "PLR0913"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Reviewer-rerun CLIs deliberately use lazy imports so schema/parser tests can
# run without downloading the large API/MLX stack. ML model/tokenizer objects
# also do not expose stable static protocols across the pinned libraries.
"src/{evaluate_v2,openai_conversion_v2,paired_dataset,rerun_utils,run_training,summarize_results}.py" = [
    "ANN401",
    "C901",
    "EM101",
    "EM102",
    "PLC0415",
    "PLR0912",
    "PLR0915",
    "PTH105",
    "S311",
    "S603",
    "T201",
    "TC003",
    "TRY003",
    "TRY004",
]
# The preparation suite uses stdlib unittest so it runs in the minimal Python
# 3.13 environment before the full locked ML stack is installed.
"tests/**/*.py" = [
    "ANN001",
    "ANN003",
    "ANN202",
    "ARG002",
    "D101",
    "D102",
    "D103",
    "FBT001",
    "FBT003",
    "PLR2004",
    "PT009",
    "PT027",
    "RUF015",
]

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false

docstring-code-line-length = "dynamic"

model: "mlx-community/Qwen3-1.7B-4bit"
fine_tune_type: lora

optimizer: adamw
optimizer_config:
  adamw:
    betas: [0.9, 0.98]
    eps: 1e-6
    weight_decay: 0.01

learning_rate: 1e-4

lr_schedule:
  name: cosine_decay
  arguments:
    - 1e-4
    - 6000
    - 1e-6

iters: 6000
save_every: 200

batch_size: 4
grad_accumulation_steps: 32

max_seq_length: 2048
num_layers: 28
grad_checkpoint: true

data: "new_data_text"

train: true
adapter_path: "qwen-adapters-run-6"

lora_parameters:
  keys: [
    "self_attn.q_proj",
    "self_attn.k_proj",
    "self_attn.v_proj",
    "self_attn.o_proj",
    "mlp.gate_proj",
    "mlp.up_proj",
    "mlp.down_proj"
  ]
  rank: 16
  scale: 8.0
  dropout: 0.05
